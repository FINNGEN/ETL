# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages 

on:
  push:
    branches: 
      - "main"
      - "development"
    paths:
      - "2_etl_specifications/documentation/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build and Deploy job
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2_etl_specifications/documentation
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set target subfolder and baseurl
        run: |
          target="dev"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            title=$(grep -m1 '^# ' ../../NEWS.md | sed 's/^# *//')
            sanitized=$(echo "$title" | tr -d ' ')
            if ! echo "$sanitized" | grep -Eq '^ETLvDF[0-9]+\.[0-9]+$'; then
              echo "NEWS.md title '$title' (sanitized: '$sanitized') does not match required format ETLvDFxx.y" >&2
              exit 1
            fi
            target="$sanitized"
          fi
          echo "TARGET_SUBDIR=$target" >> "$GITHUB_ENV"
          perl -0pi -e 's|^baseurl:\\s*.*$|baseurl: /ETL/'"$target"'|m' _config.yml
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
          working-directory: '${{ github.workspace }}/2_etl_specifications/documentation'
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "/ETL/${{ env.TARGET_SUBDIR }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3
        with:
          path: "2_etl_specifications/documentation/_site/"

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
